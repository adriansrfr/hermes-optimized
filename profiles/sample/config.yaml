model:
  default: anthropic/claude-sonnet-4
  provider: anthropic
  base_url: https://api.anthropic.com

agent:
  max_turns: 150
  verbose: false
  reasoning_effort: medium

terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  lifetime_seconds: 300

web:
  backend: firecrawl
  use_gateway: true

browser:
  inactivity_timeout: 120
  cloud_provider: browser-use
  use_gateway: true

compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  protect_first_n: 3

prompt_caching:
  cache_ttl: 5m

display:
  streaming: true
  skin: default
  tool_progress: all

gateway:
  enabled: false
  platform: discord
